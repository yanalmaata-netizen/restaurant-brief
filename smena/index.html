<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F0D0A">
<title>Передача смены · GuestUP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Смена">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C; --gold-light:#E2C878;
  --dark:#0F0D0A; --dark2:#1A1712; --dark3:#242018;
  --text:#EDE8DF; --muted:#8A836F; --border:#2E2A22;
  --red:#D9584B; --amber:#D9A441; --green:#5C9B6B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;font-size:15px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(201,168,76,.06) 0%,transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(201,168,76,.04) 0%,transparent 55%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:22px 16px 120px}

/* ШАПКА */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:inline-flex;align-items:center;gap:9px}
.logo-hex{width:26px;height:26px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);flex:none}
.logo-text{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--gold);letter-spacing:.08em}
.cloud{font-size:11px;color:var(--muted);letter-spacing:.04em;text-align:right;line-height:1.35}
.cloud b{display:block;font-weight:400;color:var(--gold)}
h1{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:400;line-height:1.15;margin-bottom:5px}
h1 em{font-style:italic;color:var(--gold)}
.sub{font-size:11.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:20px}

/* ВКЛАДКИ */
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border)}
.tab{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;font-size:11.5px;font-weight:400;padding:10px 2px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.03em}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}

/* КАРТОЧКИ */
.card{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card.accent{border-color:rgba(201,168,76,.35)}
.card.warn{border-color:rgba(217,88,75,.45)}
.card-h{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold);margin-bottom:4px}
.card-s{font-size:12px;color:var(--muted);margin-bottom:12px}

/* БЛОКИ ПЕРЕДАЧИ */
.blk{background:var(--dark2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.blk.done{border-color:rgba(92,155,107,.4)}
.blk.miss{border-color:rgba(217,88,75,.5)}
.blk-h{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;user-select:none}
.blk-ic{font-size:17px;line-height:1;flex:none}
.blk-t{flex:1;font-size:14.5px;font-weight:400;letter-spacing:.01em}
.blk-n{font-size:11px;color:var(--muted);background:var(--dark3);border-radius:20px;padding:2px 9px;flex:none}
.blk-n.ok{color:var(--green)} .blk-n.bad{color:var(--red)}
.blk-ar{color:var(--muted);font-size:11px;transition:transform .18s;flex:none}
.blk.open .blk-ar{transform:rotate(90deg)}
.blk-b{display:none;padding:0 15px 16px;border-top:1px solid var(--border);padding-top:14px}
.blk.open .blk-b{display:block}
.hint{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:12px;line-height:1.45}

/* ПОЛЯ */
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.f input[type=text],.f input[type=number],.f input[type=date],.f select,.f textarea{
  width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-family:inherit;font-size:15px;font-weight:300;padding:10px 11px;outline:none}
.f textarea{min-height:74px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:flex-start;gap:9px;padding:9px 0;cursor:pointer;font-size:13.5px;line-height:1.4}
.chk input{appearance:none;width:19px;height:19px;flex:none;margin-top:1px;border:1px solid var(--border);border-radius:5px;background:var(--dark3);cursor:pointer;position:relative}
.chk input:checked{background:var(--gold);border-color:var(--gold)}
.chk input:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dark);font-size:13px;font-weight:600}
.confirm{margin-top:12px;padding:11px 12px;background:var(--dark3);border:1px solid var(--border);border-radius:9px}
.confirm .chk{padding:0;font-size:13px}
.confirm.need{border-color:rgba(217,88,75,.5)}

/* СПИСКИ ПОЗИЦИЙ */
.item{background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;position:relative}
.item-x{position:absolute;top:8px;right:9px;background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;line-height:1;padding:2px 5px}
.add{width:100%;background:none;border:1px dashed var(--border);border-radius:9px;color:var(--muted);font-family:inherit;font-size:13px;padding:11px;cursor:pointer}
.add:hover{border-color:var(--gold);color:var(--gold)}
.empty{font-size:12.5px;color:var(--muted);padding:6px 0 12px;font-style:italic}

/* ЗАДАЧИ */
.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:none}
.task-b{flex:1;min-width:0}
.task-t{font-size:14px;line-height:1.4;word-wrap:break-word}
.task-m{font-size:11px;color:var(--muted);margin-top:3px}
.task.hot .task-t{color:var(--red)}
.task.done .task-t{text-decoration:line-through;color:var(--muted)}
.task.done .task-m{color:var(--green)}
.task.done .chk input:checked{background:var(--green);border-color:var(--green)}
.tsep{font-size:10.5px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin:18px 0 2px;padding-top:13px;border-top:1px solid var(--border)}
.pill{display:inline-block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--dark3);color:var(--muted);margin-left:6px}
.pill.hot{background:rgba(217,88,75,.15);color:var(--red)}

/* КНОПКИ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--gold);color:var(--dark);border:none;border-radius:9px;font-family:inherit;font-size:14px;font-weight:500;padding:13px 18px;cursor:pointer;letter-spacing:.02em;width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text);font-weight:400}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.sm{padding:9px 13px;font-size:12.5px;width:auto}
.btn.ok{background:var(--green);color:#fff}
.btns{display:flex;gap:9px;margin-top:14px}
.bar{position:fixed;bottom:0;left:0;right:0;z-index:9;background:rgba(15,13,10,.94);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{max-width:720px;margin:0 auto;display:flex;gap:9px;align-items:center}
.bar-in .btn{flex:1}

/* СПИСОК СМЕН */
.sh{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}
.sh:last-child{border-bottom:none}
.sh-d{font-size:14px;flex:1}
.sh-d span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.st{font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;flex:none}
.st.draft{background:var(--dark3);color:var(--muted)}
.st.sent{background:rgba(217,164,65,.15);color:var(--amber)}
.st.acc{background:rgba(92,155,107,.15);color:var(--green)}

/* ПРОСМОТР */
.ro{font-size:14px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.ro-l{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 3px}
.ro-l:first-child{margin-top:0}
.ack{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.ack-s{flex:1;font-size:12px;color:var(--green)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ph img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer}
.ph-x{position:relative}
.ph-x button{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--dark3);border:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1;cursor:pointer}

.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:10px}
.err{background:rgba(217,88,75,.12);border:1px solid rgba(217,88,75,.4);border-radius:9px;padding:11px 13px;font-size:13px;color:#F0B4AD;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--dark3);border:1px solid var(--gold);color:var(--text);font-size:13px;padding:11px 18px;border-radius:9px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.search{width:100%;background:var(--dark2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:14px;font-weight:300;padding:11px 13px;outline:none;margin-bottom:14px}
.search:focus{border-color:var(--gold)}


/* НАДИКТОВКА */
.ta{position:relative}
.ta textarea{padding-right:46px}
.mic{position:absolute;right:7px;bottom:7px;width:32px;height:32px;border-radius:8px;background:var(--dark2);border:1px solid var(--border);color:var(--muted);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic:hover{border-color:var(--gold);color:var(--gold)}
.mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}

/* ЖУРНАЛ СМЕНЫ */
.le{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.le:last-child{border-bottom:none}
.le-t{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;flex:none;width:44px;padding-top:1px}
.le-b{flex:1;min-width:0}
.le-x{font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
.le-w{font-size:11px;color:var(--muted);margin-top:2px}

/* КОММЕНТАРИИ К ЗАДАЧАМ */
.tc{margin-top:8px;padding-left:11px;border-left:1px solid var(--border)}
.tc-i{font-size:12.5px;line-height:1.45;padding:5px 0;color:var(--text);word-wrap:break-word}
.tc-i b{font-weight:500;color:var(--gold);font-size:11px;letter-spacing:.03em}
.tc-f{display:flex;gap:7px;margin-top:7px}
.tc-f input{flex:1;background:var(--dark3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;font-weight:300;padding:8px 10px;outline:none}
.tc-f input:focus{border-color:var(--gold)}
.tc-f button{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:inherit;font-size:12px;padding:0 12px;cursor:pointer}
.tc-b{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11.5px;padding:4px 0;cursor:pointer;letter-spacing:.02em}
.tc-b:hover{color:var(--gold)}

/* ПРОГРЕСС ПЕРЕДАЧИ */
.pg{height:4px;background:var(--dark3);border-radius:3px;overflow:hidden;margin-top:11px}
.pg i{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .3s}

/* ВХОД */
.who{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.who button{background:var(--dark3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:15px;padding:16px 10px;cursor:pointer}
.who button:hover{border-color:var(--gold);color:var(--gold)}
.pin{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:24px;letter-spacing:.4em;text-align:center;padding:14px;outline:none}
.pin:focus{border-color:var(--gold)}
.st-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.st-row:last-child{border-bottom:none}
.st-n{flex:1;font-size:14px}
.st-n span{display:block;font-size:11px;color:var(--muted);margin-top:2px}

/* ОТЧЁТ */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.k{background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:12px}
.k-v{font-family:'Cormorant Garamond',serif;font-size:27px;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.k-v.bad{color:var(--red)} .k-v.good{color:var(--green)}
.k-l{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;background:var(--dark3);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:inherit;font-size:12.5px;padding:9px 4px;cursor:pointer}
.seg button.on{border-color:var(--gold);color:var(--gold)}
.tw{overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:100%}
table.t th{text-align:left;font-weight:400;color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:7px 11px 7px 0;border-bottom:1px solid var(--border)}
table.t td{padding:8px 11px 8px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
table.t td.bad{color:var(--red)}
table.t td.w{white-space:normal;min-width:200px;max-width:300px;line-height:1.35;vertical-align:top}
table.t td.w span{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
table.t td.n,table.t td:first-child{vertical-align:top}
table.t td.n{text-align:center}

/* МОДАЛКА ВЫГРУЗКИ */
.mod{position:fixed;inset:0;z-index:60;background:rgba(15,13,10,.92);display:flex;align-items:center;justify-content:center;padding:18px}
.mod-in{background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto}
.mod textarea{width:100%;min-height:190px;background:var(--dark3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:10px;outline:none;white-space:pre;overflow:auto}

@media print{
  body.pt .top,body.pt h1,body.pt .sub,body.pt .tabs,body.pt .search{display:none!important}
  body.pt #view>*{display:none!important}
  body.pt #gtable{display:block!important;border:none;padding:0}
  body.pt table.t{font-size:10pt}
  body.pt table.t td.w{max-width:none}
  body.pt table.t td.w span{display:block;overflow:visible;-webkit-line-clamp:unset;line-clamp:unset}
  body{background:#fff;color:#000}
  body::before,.tabs,.bar,.top .cloud,.btn,.add,.item-x,.blk-ar{display:none!important}
  .wrap{max-width:none;padding:0}
  .blk,.card{border-color:#ccc;background:#fff;break-inside:avoid;page-break-inside:avoid}
  .blk-b{display:block!important}
  .card-h,.logo-text,h1 em{color:#000}
  .ro-l,.f label,.sub{color:#555}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><div class="logo-hex"></div><div class="logo-text">GuestUP</div></div>
    <div class="cloud" id="cloud" data-a="who"><b>—</b>локально</div>
  </div>
  <h1>Передача <em>смены</em></h1>
  <div class="sub" id="place">Ресторан · <span id="ver">v4.5</span></div>
  <div class="tabs">
    <button class="tab on" data-v="home">Смена</button>
    <button class="tab" data-v="guests">Гости</button>
    <button class="tab" data-v="tasks">Задачи</button>
    <button class="tab" data-v="rep">Отчёт</button>
    <button class="tab" data-v="arch">Архив</button>
  </div>
  <main id="view"></main>
</div>
<div class="bar" id="bar" style="display:none"><div class="bar-in" id="barin"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   Передача смены · GuestUP
   Хранение: KV на сервере (побеждает) → localStorage → пусто.
   Правка схемы блоков — только в BLOCKS ниже.
   ============================================================ */
var VER='4.5', LSKEY='guestup_smena_v1', MEKEY='guestup_smena_staff', API='/api/smena';

/* ---------- СХЕМА БЛОКОВ ПЕРЕДАЧИ ---------- */
var BLOCKS=[
{id:'brief',ic:'📣',t:'Брифинг перед сменой',
 hint:'Как daily line-up в Ritz-Carlton: коротко, до 15 минут, каждый день. Всё, что команда должна знать до первого гостя.',
 fields:[{k:'done',ty:'chk',l:'Брифинг проведён'},
         {k:'time',ty:'txt',l:'Во сколько и сколько длился'},
         {k:'who',ty:'txt',l:'Кто был, кого не было'},
         {k:'menusaid',ty:'chk',l:'Изменения в меню и сете озвучены'},
         {k:'stopsaid',ty:'chk',l:'Стоп-лист озвучен'},
         {k:'winesaid',ty:'chk',l:'Вино по бокалам и винные акценты озвучены'},
         {k:'allergysaid',ty:'chk',l:'Аллергии и диеты по сегодняшним броням озвучены'},
         {k:'banqsaid',ty:'chk',l:'План вечера по столам и банкетам разобран'},
         {k:'focus',ty:'area',l:'Акцент дня: что продаём, на что смотрим'},
         {k:'text',ty:'area',l:'О чём говорили, что спрашивали'}]},

{id:'hall',ic:'✨',ph:1,t:'Готовность зала',
 hint:'Проход по залу до первого гостя. В fine dining это не формальность: гость видит стол раньше, чем меню.',
 fields:[{k:'tables',ty:'chk',l:'Сервировка выставлена по стандарту'},
         {k:'polish',ty:'chk',l:'Приборы и бокалы отполированы'},
         {k:'linen',ty:'chk',l:'Скатерти и салфетки свежие, без пятен'},
         {k:'light',ty:'chk',l:'Свет выставлен, свечи готовы'},
         {k:'music',ty:'chk',l:'Музыка включена, громкость проверена'},
         {k:'temp',ty:'chk',l:'Температура в зале комфортная'},
         {k:'flowers',ty:'chk',l:'Цветы и декор свежие'},
         {k:'menus',ty:'chk',l:'Меню и винная карта чистые, без правок от руки'},
         {k:'wc',ty:'chk',l:'Туалеты проверены и укомплектованы'},
         {k:'plan',ty:'chk',l:'План посадки на вечер распечатан и разобран'},
         {k:'note',ty:'area',l:'Что не готово и почему'}]},

/* ---------- НАДИКТОВКА ---------- */
/* Web Speech API: Chrome и Safari 14.5+ (iOS тоже). Аудио никуда не сохраняется —
   в смену попадает только распознанный текст. */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var MIC=!!SR, REC=null, RECID='';
function micStop(){
  var r=REC;REC=null;
  var b=document.querySelector('.mic.on');if(b)b.classList.remove('on');
  if(r){try{r.stop()}catch(e){}}
  RECID='';
}
function micStart(id){
  var ta=document.getElementById(id);if(!ta)return;
  var r=new SR();r.lang='ru-RU';r.continuous=true;r.interimResults=true;
  var base=ta.value?ta.value.replace(/\s+$/,'')+' ':'';
  r.onresult=function(e){
    var fin='',int='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)fin+=e.results[i][0].transcript;else int+=e.results[i][0].transcript;
    }
    if(fin)base+=fin.trim()+'. ';
    ta.value=base+int;
    ta.dispatchEvent(new Event('input',{bubbles:true}));
  };
  r.onerror=function(e){
    if(e.error==='not-allowed')toast('Нет доступа к микрофону. Разрешите в настройках браузера.');
    else if(e.error!=='no-speech')toast('Микрофон: '+e.error);
    micStop();
  };
  r.onend=function(){ if(REC===r){try{r.start()}catch(e){micStop()}} };
  REC=r;RECID=id;
  var b=document.querySelector('[data-a="mic:'+id+'"]');if(b)b.classList.add('on');
  try{r.start()}catch(e){micStop();toast('Не удалось включить микрофон')}
  toast('Говорите. Нажмите ещё раз, чтобы остановить.');
}

/* ---------- СОТРУДНИКИ И ВХОД ---------- */
/* PIN разделяет ответственность между своими: видно, кто именно подписал приём смены.
   Это не защита от постороннего — для неё ставится Cloudflare Access на проект. */
function hashPin(p){var h=5381,x=String(p);for(var i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))>>>0;return 'h'+h.toString(36)}
function staffById(id){var r=null;(S.staff||[]).forEach(function(x){if(x.id===id)r=x});return r}
function currentStaff(){return staffById(meId)}
function setMe(st){
  if(!st){meId='';me='';localStorage.removeItem(MEKEY);return}
  meId=st.id;me=st.name;localStorage.setItem(MEKEY,meId);
}
function isBoss(){var st=currentStaff();return !!st&&st.role==='Управляющий'}

/* ---------- УТИЛИТЫ ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function rus(iso){if(!iso)return '';var p=String(iso).split('-');return p.length<3?iso:(+p[2])+' '+MON[(+p[1])-1]}
function fmt(n){if(n===''||n==null)return '';var v=String(n).replace(/\s/g,'');if(isNaN(v))return n;return Number(v).toLocaleString('ru-RU')}
function hhmm(ts){if(!ts)return '';var d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('on')},2600)}
function blk(id){for(var i=0;i<BLOCKS.length;i++)if(BLOCKS[i].id===id)return BLOCKS[i];return null}
function D(sh,bid){if(!sh.data[bid])sh.data[bid]={};return sh.data[bid]}
function L(sh,bid){var d=D(sh,bid);if(!d.__list)d.__list=[];return d.__list}
function shiftById(id){for(var i=0;i<S.shifts.length;i++)if(S.shifts[i].id===id)return S.shifts[i];return null}
function partName(p){return p==='night'?'Вечер / закрытие':'Утро / открытие'}

/* ---------- ХРАНЕНИЕ ---------- */
function norm(){S.staff=S.staff||[];S.guests=S.guests||[];S.tasks=S.tasks||[];S.shifts=S.shifts||[];
  if(S.crm==null)S.crm=LINKS.crm;
  if(S.tasker==null)S.tasker=LINKS.tasker;
  if(S.workly==null)S.workly=LINKS.workly;
  var st=currentStaff();me=st?st.name:'';}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{var r=localStorage.getItem(LSKEY);if(r){var o=JSON.parse(r);if(o&&o.shifts)S=o}}catch(e){}norm()}

var _t=null;
function touch(re){saveLocal();if(re!==false)render();clearTimeout(_t);_t=setTimeout(saveCloud,1600)}

function loadCloud(){
  return fetch(API,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    cloudOK=true;
    if(j&&j.state&&j.state.shifts){S=j.state;S.rev=j.rev||0;norm();saveLocal()}
    else{S.rev=j&&j.rev||0}
    savedAt=j&&j.at?hhmm(j.at):'';cloudStatus();render();
  }).catch(function(){cloudOK=false;cloudStatus()});
}
function saveCloud(force){
  if(!cloudOK)return Promise.resolve();
  var body={rev:S.rev,state:{place:S.place,sheet:S.sheet||'',workly:S.workly||'',crm:S.crm||'',
    tasker:S.tasker||'',staff:S.staff,guests:S.guests,shifts:S.shifts,tasks:S.tasks},force:!!force};
  return fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
   .then(function(r){
     if(r.status===409){
       if(confirm('На сервере есть более свежая версия — кто-то сохранил раньше.\n\nОК — перезаписать своей версией.\nОтмена — загрузить свежую (ваши несохранённые правки пропадут).')){
         return saveCloud(true);
       }
       return loadCloud();
     }
     if(!r.ok)throw 0;
     return r.json().then(function(j){S.rev=j.rev;savedAt=hhmm(j.at);saveLocal();cloudStatus()});
   }).catch(function(){cloudOK=false;cloudStatus()});
}
function cloudStatus(){
  var e=document.getElementById('cloud');
  var who=me?('<b>'+esc(me)+'</b>'):'<b>Не вошли</b>';
  e.innerHTML=who+(cloudOK?(savedAt?'сохранено '+savedAt:'облако'):'только этот телефон');
}

    'data-a="tcopy:'+t.id+'" style="text-decoration:none;display:inline-block;margin-right:14px">В doit.ok ↗</a>';

     '<button data-a="cadd:'+t.id+'">→</button></div></div>';
  return h+'</div></div>';

/* ---------- РЕНДЕР ПОЛЕЙ ---------- */
function fval(sh,bid,k,i){
  if(i==null)return D(sh,bid)[k]==null?'':D(sh,bid)[k];
  var it=L(sh,bid)[i]||{};return it[k]==null?'':it[k];
}
function ta(id,at,v){
  return '<div class="ta"><textarea id="'+id+'" '+at+'>'+esc(v)+'</textarea>'+
    (MIC?'<button type="button" class="mic" data-a="mic:'+id+'" aria-label="Надиктовать">🎙</button>':'')+'</div>';
}
function field(f,sh,bid,i,ro){
  var v=fval(sh,bid,f.k,i);
  var at='data-b="'+bid+'" data-k="'+f.k+'"'+(i==null?'':' data-i="'+i+'"');
  if(ro){
    if(f.ty==='chk')return '<div class="ro-l">'+esc(f.l)+'</div><div class="ro">'+(v?'✓ да':'— нет')+'</div>';
    if(!String(v).trim())return '';
    var show=f.ty==='date'?rus(v):(f.ty==='num'?fmt(v):v);
    return '<div class="ro-l">'+esc(f.l)+'</div><div class="ro">'+esc(show)+'</div>';
  }
  if(f.ty==='chk')return '<label class="chk"><input type="checkbox" '+at+(v?' checked':'')+'><span>'+esc(f.l)+'</span></label>';
  var h='<div class="f"><label>'+esc(f.l)+(f.req?' *':'')+'</label>';
  if(f.ty==='area')h+=ta('ta-'+bid+'-'+f.k+'-'+(i==null?'x':i),at,v);
  else if(f.ty==='sel'){h+='<select '+at+'><option value="">—</option>';
    f.o.forEach(function(o){h+='<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>'});h+='</select>';}
  else if(f.ty==='num')h+='<input type="number" inputmode="numeric" '+at+' value="'+esc(v)+'">';
  else if(f.ty==='date')h+='<input type="date" '+at+' value="'+esc(v)+'">';
  else h+='<input type="text" '+at+' value="'+esc(v)+'">';
  return h+'</div>';
}
function filled(sh,b){
  var n=0,d=sh.data[b.id]||{};
  (b.fields||[]).forEach(function(f){var v=d[f.k];if(f.ty==='chk'){if(v)n++}else if(String(v==null?'':v).trim())n++});
  n+=(d.__list||[]).length;
  n+=(d.__log||[]).length;
  n+=((sh.photos||{})[b.id]||[]).length;
  return n;
}

  var n=filled(sh,b), ack=(sh.ack||{})[b.id];
  var cls='blk'+(opened[b.id]?' open':'')+(ack?' done':'')+((mode==='accept'&&!ack)?' miss':'');
  var badge=mode==='accept'?(ack?'<div class="blk-n ok">принято</div>':'<div class="blk-n bad">принять</div>')
                           :(n?'<div class="blk-n">'+n+'</div>':'');

/* ---------- KPI И ВЫГРУЗКА ---------- */
/* Считаем то же, что меряют Jolt, Zenput и Trail: процент выполнения,
   скорость закрытия и что осталось незакрытым. */
function pctChk(s,bid){
  var b=blk(bid);if(!b)return 0;
  var f=(b.fields||[]).filter(function(x){return x.ty==='chk'});
  var d=s.data[bid]||{}, y=0;
  f.forEach(function(x){if(d[x.k])y++});
  return f.length?Math.round(y/f.length*100):0;
}
function shiftKPI(s){
  var k={date:s.date,part:partName(s.part),from:s.from||'',to:s.acceptedBy||s.to||''};
  k.status=s.status==='accepted'?'принята':(s.status==='sent'?'ждёт приёма':'черновик');
  k.sent=s.sentAt?hhmm(s.sentAt):'';
  k.acc=s.acceptedAt?hhmm(s.acceptedAt):'';
  k.min=(s.sentAt&&s.acceptedAt)?Math.max(0,Math.round((s.acceptedAt-s.sentAt)/60000)):'';
  var f=0;BLOCKS.forEach(function(b){if(filled(s,b))f++});
  k.blocks=f;k.blocksPct=Math.round(f/BLOCKS.length*100);
  k.closePct=pctChk(s,'closing');
  k.hallPct=pctChk(s,'hall');
  k.brief=(s.data.brief||{}).done?'да':'нет';
  k.guests=(s.data.summary||{}).guests||'';
  var g=((s.data.guestcase||{}).__list)||[];
  k.complaints=g.filter(function(x){return x.kind==='Жалоба'}).length;
  k.promisesOpen=g.filter(function(x){return x.kind==='Обещание гостю'&&x.status!=='Закрыто'}).length;
  var bd=s.data.banquets||{}, bq=bd.__list||[];
  k.noshow=+(bd.noshow||0); k.cancel=+(bd.cancel||0);
  k.allergy=g.filter(function(x){return x.kind==='Аллергия / диета'}).length+
            bq.filter(function(x){return String(x.allergy||'').trim()}).length;
  k.banqRisk=bq.filter(function(x){return x.dep==='Нет'||x.menu==='Не согласовано'}).length;
  k.log=(((s.data.log||{}).__log)||[]).length;
  k.noface=(((s.data.workly||{}).__list)||[]).length;
  k.created=S.tasks.filter(function(t){return t.from===s.id}).length;
  k.closed=S.tasks.filter(function(t){return t.doneShift===s.id}).length;
  return k;
}
var COLS=[['Дата','date'],['Смена','part'],['Сдал','from'],['Принял','to'],['Статус','status'],
  ['Минут до приёма','min'],['Полнота передачи, %','blocksPct'],['Готовность зала, %','hallPct'],
  ['Чек-лист закрытия, %','closePct'],['Брифинг','brief'],['Записей в журнале','log'],
  ['Гостей','guests'],['No-show','noshow'],['Отмен','cancel'],
  ['Жалоб','complaints'],['Обещаний открыто','promisesOpen'],['Аллергий отмечено','allergy'],
  ['Банкетов на контроле','banqRisk'],['Не прошли Face ID','noface'],
  ['Задач поставлено','created'],['Задач закрыто','closed']];
function tableRows(list){
  var rows=[COLS.map(function(c){return c[0]})];

}

function pickPhoto(bid){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var m=1000,w=img.width,h=img.height;
        if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m}else{w=Math.round(w*m/h);h=m}}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var sh=shiftById(cur);if(!sh)return;
        if(!sh.photos)sh.photos={};if(!sh.photos[bid])sh.photos[bid]=[];
        if(sh.photos[bid].length>=4){toast('Не больше 4 фото на блок');return}
        sh.photos[bid].push(c.toDataURL('image/jpeg',0.7));
        opened[bid]=true;touch();
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

    loginErr='';
    if(nm.length<2)loginErr='Впишите имя';
    else if(!/^\d{4,6}$/.test(p1))loginErr='PIN — от четырёх до шести цифр';
    else if(p1!==p2)loginErr='PIN не совпал, введите ещё раз';
    if(loginErr)return render();
    var st={id:uid(),name:nm,pin:hashPin(p1),role:'Управляющий',createdAt:Date.now()};
    S.staff.push(st);setMe(st);cloudStatus();return touch();
  }
  if(a==='pick'){loginPick=a1;loginErr='';return render()}
  if(a==='pickback'){loginPick=null;loginErr='';return render()}
  if(a==='login'){
    var st2=staffById(loginPick), pv=document.getElementById('lg-pin').value;
    if(!st2)return;
    if(st2.pin!==hashPin(pv)){loginErr='Неверный PIN';return render()}
    setMe(st2);loginPick=null;loginErr='';view='home';cloudStatus();return render();
  }
  if(a==='who'){
    if(!me)return;
    if(confirm('Выйти из аккаунта «'+me+'»?')){setMe(null);loginPick=null;cloudStatus();render()}
    return;
  }
  if(a==='stog'){sOpen[a1]=!sOpen[a1];return render()}
  if(a==='staffadd'){
    if(!isBoss()){toast('Добавлять сотрудников может только управляющий');return}
    var an=(document.getElementById('sa-name').value||'').trim();
    var ap=document.getElementById('sa-pin').value;
    if(an.length<2){toast('Впишите имя');return}
    if(!/^\d{4,6}$/.test(ap)){toast('PIN — от четырёх до шести цифр');return}
    S.staff.push({id:uid(),name:an,pin:hashPin(ap),role:document.getElementById('sa-role').value,createdAt:Date.now()});
    toast('Сотрудник добавлен');return touch();
  }
  if(a==='staffpin'){
    var sp=staffById(a1);if(!sp)return;
    if(!isBoss()&&sp.id!==meId){toast('Менять чужой PIN может только управляющий');return}
    var np=prompt('Новый PIN для «'+sp.name+'» — от четырёх до шести цифр:','');
    if(np===null)return;
    if(!/^\d{4,6}$/.test(np)){toast('PIN — от четырёх до шести цифр');return}
    sp.pin=hashPin(np);toast('PIN изменён');return touch();
  }
  if(a==='staffdel'){
    if(!isBoss()){toast('Удалять сотрудников может только управляющий');return}
    if(a1===meId){toast('Себя удалить нельзя');return}
    var sd=staffById(a1);if(!sd)return;
    if(!confirm('Удалить «'+sd.name+'»? Подписи под прошлыми сменами останутся.'))return;
    S.staff=S.staff.filter(function(x){return x.id!==a1});return touch();
  }

  if(a==='tog'){opened[a1]=!opened[a1];return render()}
  if(a==='back'){view='home';cur=null;errs=[];return render()}
  if(a==='open'){
    cur=a1;view='shift';errs=[];
    var s0=shiftById(a1);
    // Принимающий должен пройти все блоки — раскрываем их сразу.
    if(s0&&s0.status==='sent'){opened={__tasks:true};BLOCKS.forEach(function(b){opened[b.id]=true})}
    return render();
  }

  if(a==='new'){
    var s={id:uid(),date:document.getElementById('ns-date').value||today(),
           part:document.getElementById('ns-part').value,from:me,fromId:meId,to:'',
           status:'draft',data:{},ack:{},photos:{},createdAt:Date.now()};
    S.shifts.unshift(s);cur=s.id;view='shift';opened={__tasks:true,brief:true,hall:true,log:true};
    return touch();
  }

  if(a==='add'){L(sh,a1).push({});opened[a1]=true;return touch()}
  if(a==='del'){if(confirm('Удалить позицию?')){L(sh,a1).splice(+a2,1);touch()}return}
  if(a==='ph'){return pickPhoto(a1)}
  if(a==='delph'){sh.photos[a1].splice(+a2,1);return touch()}
  if(a==='big'){
    var o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
    o.innerHTML='<img src="'+sh.photos[a1][+a2]+'" style="max-width:100%;max-height:100%;border-radius:8px">';
    o.onclick=function(){o.remove()};document.body.appendChild(o);return;
  }

  if(a==='mic'){ if(REC&&RECID===a1)micStop(); else {micStop();micStart(a1)} return }
  if(a==='logadd'){
    var le=document.getElementById('log-new');
    if(!le||!le.value.trim()){toast('Напишите или надиктуйте запись');return}
    micStop();
    var lg=D(sh,'log');if(!lg.__log)lg.__log=[];
    lg.__log.unshift({at:Date.now(),by:me||sh.from||'',text:le.value.trim()});
    opened.log=true;return touch();
  }
  if(a==='logdel'){
    if(!confirm('Удалить запись из журнала?'))return;
    D(sh,'log').__log.splice(+a1,1);return touch();
  }
  if(a==='gseg'){gOnly=+a1;return render()}
  if(a==='gcopy'){return showExport(toTSV(guestRows()))}
  if(a==='gprint'){
    document.body.classList.add('pt');
    window.print();
    setTimeout(function(){document.body.classList.remove('pt')},800);
    return;
  }
  if(a==='gtog'){gOpen[a1]=!gOpen[a1];return render()}
  if(a==='gadd'){
    var gn=(document.getElementById('ng-name').value||'').trim();
    if(gn.length<2){toast('Впишите имя гостя');return}
    S.guests.unshift({id:uid(),name:gn,phone:(document.getElementById('ng-phone').value||'').trim(),
      table:'',prefs:'',allergy:'',note:'',visits:[],createdAt:Date.now()});
    toast('Гость добавлен');return touch();
  }
  if(a==='gdel'){
    var gg=guestById(a1);if(!gg)return;
    if(!confirm('Удалить «'+(gg.name||'гостя')+'» из книги? История визитов пропадёт.'))return;
    S.guests=S.guests.filter(function(x){return x.id!==a1});return touch();
  }
  if(a==='mkguest'){
    var gi=L(sh,'guestcase')[+a1];
    if(!gi)return;
    var raw=String(gi.who||'').trim();
    if(raw.length<2){toast('Сначала впишите, кто гость');return}
    var pm=raw.match(/\+?\d[\d\s\-()]{8,}/);
    var phone=pm?pm[0].trim():'';
    var nm=raw.replace(phone,'').replace(/^[\s,;·-]+|[\s,;·-]+$/g,'');
    var g=findGuest(nm,phone);
    if(!g){
      g={id:uid(),name:nm||raw,phone:phone,table:'',prefs:'',allergy:'',note:'',visits:[],createdAt:Date.now()};
      S.guests.unshift(g);
    }else if(phone&&!g.phone){g.phone=phone}
    g.visits=g.visits||[];
    g.visits.push({at:Date.now(),date:sh.date,shiftId:sh.id,kind:gi.kind||'',what:gi.what||'',by:me});
    if(gi.kind==='Аллергия / диета'&&gi.what)g.allergy=g.allergy?(g.allergy+'; '+gi.what):gi.what;
    if(gi.kind==='VIP или постоянный гость'&&gi.what)g.prefs=g.prefs?(g.prefs+'; '+gi.what):gi.what;
    gi.__guest=g.id;
    toast('Карточка гостя пополнена');return touch();
  }
  if(a==='mktask'){
    var mb=blk(a1), it=L(sh,a1)[+a2];
    if(!it||!mb||!mb.mk)return;
    var txt=String(mb.mk.text(it)||'').replace(/\s+/g,' ').trim();
    if(txt.length<6){toast('Сначала заполните позицию');return}
    if(txt.length>180)txt=txt.slice(0,177)+'…';
    var nid=uid();
    S.tasks.unshift({id:nid,text:txt,owner:(mb.mk.owner?it[mb.mk.owner]:'')||'',
      due:(mb.mk.due?it[mb.mk.due]:'')||'',from:cur||'',createdAt:Date.now(),carried:0,done:false,comments:[]});
    it.__task=nid;opened.__tasks=true;toast('Задача создана');
    return touch();
  }
  if(a==='tcopy'){
    var tc=null;S.tasks.forEach(function(x){if(x.id===a1)tc=x});
    if(tc)copyText(tc.text+(tc.owner?' — '+tc.owner:'')+(tc.due?' (до '+tc.due+')':''));
    return;
  }
  if(a==='cadd'){
    var ci=document.getElementById('cm-'+a1);
    if(!ci||!ci.value.trim()){toast('Напишите комментарий');return}
    var tk=null;S.tasks.forEach(function(x){if(x.id===a1)tk=x});
    if(tk){if(!tk.comments)tk.comments=[];tk.comments.push({by:me||whoAmI()||'—',at:Date.now(),text:ci.value.trim()})}
    return touch();
  }
  if(a==='tdone'){
    var task=null;S.tasks.forEach(function(x){if(x.id===a1)task=x});
    if(task){
      if(task.done){ task.done=false;task.doneAt=0;task.doneBy='';task.doneShift='' }
      else { task.done=true;task.doneAt=Date.now();task.doneBy=me||whoAmI()||'—';task.doneShift=cur||'' }
    }
    return touch();
  }
  if(a==='tadd'){
    var tx=document.getElementById('nt-text');
    if(!tx||!tx.value.trim()){toast('Напишите задачу');return}
    addTask(tx.value,(document.getElementById('nt-own')||{}).value,(document.getElementById('nt-due')||{}).value,cur||'');
    opened.__tasks=true;return touch();
  }

  if(a==='send'){
    errs=problems(sh);
    if(errs.length){render();window.scrollTo(0,0);return}
    sh.status='sent';sh.sentAt=Date.now();
    touch();saveCloud();
    toast('Смена передана. Принимающий подтверждает блоки.');
    return;
  }
  if(a==='ack'){
    if(!me)return;
    if(!sh.ack)sh.ack={};
    sh.ack[a1]={by:me,at:Date.now()};
    return touch();
  }
  if(a==='reopen'){
    if(!confirm('Вернуть смену в работу? Все подтверждения блоков сбросятся.'))return;
    sh.status='draft';sh.ack={};return touch();
  }
  if(a==='accept'){
    if(!me)return;
    sh.status='accepted';sh.acceptedAt=Date.now();sh.acceptedBy=me;sh.acceptedById=meId;
    openTasks().forEach(function(x){x.carried=(x.carried||0)+1});
    if(S.sheet)toSheet(tableRows([sh]),true);
    view='home';cur=null;touch();saveCloud();
    toast('Смена принята. Открытые задачи перенесены.');
    return;
  }
  if(a==='per'){period=+a1;return render()}
  if(a==='excopy2'){return showExport(toTSV(tableRows(S.shifts.filter(inPeriod))))}
  if(a==='excsv'){return download('smena-'+today()+'.csv',toCSV(tableRows(S.shifts.filter(inPeriod))))}
  if(a==='sheetnow'){return toSheet(tableRows(S.shifts.filter(inPeriod)))}
  if(a==='exclose'){var mm=document.getElementById('mod');if(mm)mm.remove();return}
  if(a==='excopy'){
    var ex=document.getElementById('ex');ex.select();
    var done=false;
    try{done=document.execCommand('copy')}catch(e){}
    if(!done&&navigator.clipboard){navigator.clipboard.writeText(ex.value).then(function(){toast('Скопировано')});return}
    toast(done?'Скопировано':'Выделите текст и скопируйте вручную');return;
  }
  if(a==='print'){return window.print()}
  if(a==='place'){
    var pn=prompt('Название заведения:',S.place);
    if(pn&&pn.trim()){S.place=pn.trim();touch()}
    return;
  }
},false);

document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){q=el.value;clearTimeout(window._q);window._q=setTimeout(render,250);return}
  if(el.id==='gq'){gq=el.value;clearTimeout(window._gq);window._gq=setTimeout(render,250);return}
  if(el.dataset.g){var gx=guestById(el.dataset.g);if(gx){gx[el.dataset.k]=el.value;touch(false)}return}
  var sh=cur?shiftById(cur):null;
  if(el.dataset.set){S[el.dataset.set]=el.value;return touch(false)}
  if(el.dataset.h&&sh){sh[el.dataset.h]=el.value;return touch(false)}
  if(!el.dataset.b||!sh)return;
  var b=el.dataset.b,k=el.dataset.k,i=el.dataset.i;
  var v=el.type==='checkbox'?el.checked:el.value;
  if(i==null||i==='')D(sh,b)[k]=v; else {var it=L(sh,b)[+i];if(it)it[k]=v}
  if(k==='__confirm'){var box=el.closest('.confirm');if(box)box.classList.toggle('need',!v)}
  touch(false);
},false);
document.addEventListener('change',function(e){
  if(e.target.dataset&&(e.target.dataset.b||e.target.dataset.h))document.dispatchEvent(new Event('noop'));
},false);

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){view=b.dataset.v;cur=null;errs=[];render()});
});
document.getElementById('place').addEventListener('click',function(){
  var pn=prompt('Название заведения:',S.place);
  if(pn&&pn.trim()){S.place=pn.trim();touch()}
});

/* ---------- СТАРТ ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
loadLocal();
opened={__tasks:true};
cloudStatus();
render();
loadCloud();
window.addEventListener('focus',function(){if(cloudOK&&view!=='shift')loadCloud()});
</script>
</body>
</html>
